<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Somil Mittal</title>
  <link rel="icon" type="image/png" href="/SomilPortfolio/src/assets/logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

      .container {
        max-width: 480px;
        width: 100%;
      }

        .code {
          font-size: clamp(96px, 20vw, 150px);
          font-weight: 800;
          line-height: 1;
          letter-spacing: -4px;
          color: #f8fafc;
          margin-bottom: 8px;
        }

          h1 {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            margin-bottom: 12px;
            color: #f8fafc;
            letter-spacing: -0.5px;
          }

            p {
              font-size: 16px;
              color: #94a3b8;
              line-height: 1.5;
              margin-bottom: 32px;
            }


            .btn {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 12px 28px;
              border-radius: 10px;
              background-color: #10b981;
              color: #042f1a;
              font-size: 15px;
              font-weight: 600;
              text-decoration: none;
              transition: opacity 0.2s ease, transform 0.2s ease;
            }


              .btn:hover {
                opacity: 0.9;
                transform: translateY(-1px);
              }

  </style>
</head>

<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/SomilPortfolio/" class="btn">Back to Home</a>
  </div>
</body>

</html>
